name: Docs quality check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run docs check
        run: npm run docs:check

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: docs-quality-report
          path: docs-site/.vitepress/generated/quality-report.json
